<!doctype html>
<meta charset="utf-8" />
<title>FramePressure probe</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 13px ui-monospace, monospace; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #log { position: fixed; inset: auto 8px 8px 8px; z-index: 2; white-space: pre; }
</style>
<canvas id="gl"></canvas>
<div id="log">booting…</div>

<script type="module">
  import { getConductor, getFramePressure } from "/dist/index.js";

  const log = (m) => { document.getElementById("log").textContent = m; };

  // ── A real GPU load: one draw call, an expensive fragment shader ──────────
  //
  // This is the only way to produce render pressure without also producing
  // main-thread work. A blur filter or a thousand DOM nodes would load style
  // and paint, which are main-thread, and the classifier would be right to
  // call that "main-thread".
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl2");
  let glProgram = null;
  let uIter = null;
  let uTime = null;

  function initGL() {
    if (!gl) return false;
    const vs = `#version 300 es
      in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
    const fs = `#version 300 es
      precision highp float;
      uniform int uIter; uniform float uTime;
      out vec4 o;
      void main(){
        vec2 uv = gl_FragCoord.xy * 0.002;
        float a = 0.0;
        for (int i = 0; i < 16384; i++) {
          if (i >= uIter) break;
          a += sin(uv.x * float(i) + uTime) * cos(uv.y * float(i) - uTime);
        }
        o = vec4(vec3(a * 0.002 + 0.05), 1.0);
      }`;
    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    glProgram = gl.createProgram();
    gl.attachShader(glProgram, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(glProgram, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(glProgram);
    if (!gl.getProgramParameter(glProgram, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(glProgram));
    gl.useProgram(glProgram);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(glProgram, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uIter = gl.getUniformLocation(glProgram, "uIter");
    uTime = gl.getUniformLocation(glProgram, "uTime");
    return true;
  }

  function sizeCanvas() {
    canvas.width = Math.floor(innerWidth * devicePixelRatio);
    canvas.height = Math.floor(innerHeight * devicePixelRatio);
    gl?.viewport(0, 0, canvas.width, canvas.height);
  }

  const hasGL = initGL();
  sizeCanvas();

  /** Burn `ms` of main-thread time. Deliberately not optimisable away. */
  function burn(ms) {
    const end = performance.now() + ms;
    let x = 0;
    while (performance.now() < end) x += Math.sqrt(x + 1);
    return x;
  }

  // ── Scenarios ────────────────────────────────────────────────────────────

  const scenarios = {
    /** Nothing but the classifier. Frames should be clean. */
    idle: () => () => {},

    /** A VV subscriber that eats the frame. The runtime is the cause. */
    runtime: () => {
      const off = getConductor().subscribe("update", () => burn(24), {
        priority: "essential",     // essential so shedding cannot hide it
        label: "probe-load",
      });
      return off;
    },

    /**
     * Main-thread work that is NOT a VV subscriber — its own rAF loop, which
     * is exactly what an uncooperative third-party library looks like.
     */
    "main-thread": () => {
      let alive = true;
      const tick = () => { if (!alive) return; burn(24); requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
      return () => { alive = false; };
    },

    /**
     * Heavy fragment shader, one draw call. Almost no main-thread cost.
     *
     * The iteration count STEERS ITSELF, and that is the whole point.
     *
     * This was a fixed 420, chosen because it produced 30-40ms frames on the
     * machine it was written on. GPUs got faster; the same 420 iterations
     * later produced 17-19ms frames — a real dip to 52-58fps, but comfortably
     * inside the classifier's slow line, which only speaks for frames 25% over
     * budget. So the classifier correctly answered "none", the harness
     * asserted "render", and three rows failed for a load that had quietly
     * stopped being a load. A hard-coded number cannot survive the hardware
     * moving underneath it.
     *
     * The band is derived from the measured frame budget rather than from
     * FramePressure's SLOW_FACTOR directly: the test should demand a frame
     * that is *unambiguously* blown, not one that sits a hair over whatever
     * the current threshold happens to be. 2x-3.2x budget clears any plausible
     * slow line with margin, and stops well short of the point where the
     * driver starts taking the context away.
     */
    render: () => {
      if (!hasGL) throw new Error("no webgl2");

      const budgetMs = getConductor().frameBudgetMs || 16.7;
      const TARGET_LOW = budgetMs * 2.0;
      const TARGET_HIGH = budgetMs * 3.2;

      // Must match the fragment shader's loop bound. A JS cap above it is
      // silently clamped and the controller would keep "raising" a load that
      // had already stopped rising.
      const MAX_ITER = 16384;
      // Far enough past the band that the driver's watchdog becomes a real
      // risk. One 1.6x overshoot is recoverable; sitting here is not.
      const DANGER = budgetMs * 8;

      let alive = true;
      let iterations = 256;
      let inBand = 0;
      let lastAdjust = 0;
      let prev = performance.now();

      const tick = (t) => {
        if (!alive) return;
        const frameMs = t - prev;
        prev = t;

        // Seek fast, then correct slowly. The scenario is only measured for
        // four seconds, so a leisurely ramp would spend the window climbing
        // instead of sitting in the band being classified.
        // An overshoot is cut immediately rather than at the next interval:
        // waiting 120ms at 200ms/frame is how a context gets taken away.
        if (frameMs > DANGER) {
          iterations = Math.max(64, Math.round(iterations * 0.5));
          inBand = 0;
          lastAdjust = t;
        }

        const interval = inBand >= 2 ? 400 : 120;
        if (t - lastAdjust > interval) {
          if (frameMs > TARGET_HIGH) {
            iterations = Math.max(64, Math.round(iterations * 0.7));
            inBand = 0;
            lastAdjust = t;
          } else if (frameMs < TARGET_LOW) {
            iterations = Math.min(MAX_ITER, Math.round(iterations * 1.6));
            inBand = 0;
            lastAdjust = t;
          } else {
            inBand++;
            lastAdjust = t;
          }
        }

        gl.uniform1i(uIter, iterations);
        gl.uniform1f(uTime, t * 0.001);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      return () => { alive = false; gl.clear(gl.COLOR_BUFFER_BIT); };
    },
  };

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  window.__probe = {
    hasGL,
    renderer: (() => {
      if (!gl) return "none";
      const ext = gl.getExtension("WEBGL_debug_renderer_info");
      return ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : "unknown";
    })(),

    async run(name, ms = 4000) {
      // A hidden tab pauses rAF entirely. Measuring nothing and reporting a
      // pass is the failure this whole harness exists to avoid.
      if (document.hidden) return { error: "document.hidden — rAF is paused" };

      const stop = scenarios[name]();
      let last = null;
      // Subscribing starts the classifier; it also resets when the last
      // listener leaves, so each scenario gets a clean policy.
      const off = getFramePressure().subscribe((s) => { last = s; });

      await sleep(ms);
      const state = last ?? getFramePressure().state;
      const snapshot = JSON.parse(JSON.stringify(state));
      const cs = getConductor().state;
      snapshot.displayHz = cs.displayHz;
      snapshot.probeBudget = cs.frameBudgetMs;

      off();
      stop();
      // Let the page settle before the next scenario measures anything.
      await sleep(600);
      log(`${name}: ${snapshot.source} ${(snapshot.confidence * 100) | 0}%`);
      return snapshot;
    },
  };

  log("ready");
  document.title = "probe-ready";
</script>
