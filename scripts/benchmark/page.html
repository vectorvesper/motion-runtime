<!doctype html>
<meta charset="utf-8" />
<title>VV benchmark</title>
<style>
  body { margin: 0; background: #0d0d10; color: #eee; font: 12px ui-monospace, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  .dot {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(140deg, #7EACB5, #2b4d55);
    will-change: transform; top: 0; left: 0;
  }
  .dot.lead { background: linear-gradient(140deg, #ffd479, #b07d21); width: 40px; height: 40px; }
  #log { position: fixed; left: 8px; bottom: 8px; z-index: 5; white-space: pre; }
</style>
<div id="stage"></div>
<div id="log">booting…</div>

<script type="module">
  import { SCENARIOS, run, setStage } from "./scenarios.mjs";

  setStage(document.getElementById("stage"));
  const log = (m) => { document.getElementById("log").textContent = m; };

  window.__bench = {
    scenarios: Object.keys(SCENARIOS),
    arms: (name) => Object.keys(SCENARIOS[name].arms),
    count: (name) => SCENARIOS[name].count,

    async run(name, armName, ms = 5000, load = 220) {
      log(`${name} · ${armName} · load ${load}…`);
      const out = await run(name, armName, ms, load);
      if (!out.error) log(`${name} · ${armName} · ${out.intervals.length} frames`);
      return out;
    },
  };

  log("ready");
</script>
